"Credential backend selected for this server process."
enum CredentialStorageType {
  "Represents the database option."
  DATABASE
  "Represents the vault option."
  VAULT
  "Represents the keychain option."
  KEYCHAIN
  "The credential storage type is not known."
  UNKNOWN
}

"Overall credential-store health without probing external secret values."
enum CredentialStoreState {
  "Represents the ready state for credential store."
  READY
  "Represents the warning state for credential store."
  WARNING
  "Represents the error state for credential store."
  ERROR
}

"Protection applied by the selected credential backend."
enum CredentialEncryptionState {
  "Represents the encrypted state for credential encryption."
  ENCRYPTED
  "Represents the plaintext state for credential encryption."
  PLAINTEXT
  "Represents the external state for credential encryption."
  EXTERNAL
  "Represents the error state for credential encryption."
  ERROR
}

"Protection recorded for one credential item."
enum CredentialProtection {
  "Represents the encrypted option."
  ENCRYPTED
  "Represents the plaintext option."
  PLAINTEXT
  "Represents the vault option."
  VAULT
  "Represents the keychain option."
  KEYCHAIN
}

"Stable, machine-readable credential-store warning."
enum CredentialStoreWarningCode {
  "Represents the database unencrypted option."
  DATABASE_UNENCRYPTED
  "Represents the credential encryption key invalid option."
  CREDENTIAL_ENCRYPTION_KEY_INVALID
  "Represents the credential encryption key missing option."
  CREDENTIAL_ENCRYPTION_KEY_MISSING
  "Represents the credential encryption key mismatch option."
  CREDENTIAL_ENCRYPTION_KEY_MISMATCH
  "Represents the credential data invalid option."
  CREDENTIAL_DATA_INVALID
  "Represents the credential storage type invalid option."
  CREDENTIAL_STORAGE_TYPE_INVALID
  "Represents the credential store unavailable option."
  CREDENTIAL_STORE_UNAVAILABLE
  "Represents the vault configuration invalid option."
  VAULT_CONFIGURATION_INVALID
  "Represents the vault insecure HTTP option."
  VAULT_INSECURE_HTTP
  "Represents the vault tls verification disabled option."
  VAULT_TLS_VERIFICATION_DISABLED
  "Represents the keychain unsupported platform option."
  KEYCHAIN_UNSUPPORTED_PLATFORM
  "Represents the backend mismatch option."
  BACKEND_MISMATCH
}

"A safe, non-secret configuration detail."
type CredentialStoreDetail {
  "Human-readable label for this credential store detail."
  label: String!
  "The value associated with this credential store detail."
  value: String!
}

"A safe warning that never includes a secret or authentication header value."
type CredentialStoreWarning {
  "The code associated with this credential store warning."
  code: CredentialStoreWarningCode!
  "Human-readable message associated with this credential store warning."
  message: String!
}

"Current credential-store configuration and protection health."
type CredentialStoreStatus {
  "The storage type associated with this credential store status."
  storageType: CredentialStorageType!
  "Current state of this credential store status."
  state: CredentialStoreState!
  "The encryption state associated with this credential store status."
  encryptionState: CredentialEncryptionState!
  "Details associated with this credential store status."
  details: [CredentialStoreDetail!]!
  "Number of items."
  itemCount: Int!
  "Number of mismatchs."
  mismatchCount: Int!
  "Warnings associated with this credential store status."
  warnings: [CredentialStoreWarning!]!
}

"Metadata-only inventory entry. Secret payloads are never exposed by GraphQL."
type CredentialMetadata {
  "Stable identifier for this credential metadata."
  id: ID!
  "Category of this credential metadata."
  kind: String!
  "Identifier of the related owner. May be null when unavailable or not applicable."
  ownerId: ID
  "The owner feature associated with this credential metadata."
  ownerFeature: String!
  "The storage type associated with this credential metadata."
  storageType: CredentialStorageType!
  "The protection associated with this credential metadata."
  protection: CredentialProtection!
  "ISO 8601 timestamp when this credential metadata was created."
  createdAt: String!
  "ISO 8601 timestamp when this credential metadata was last updated."
  updatedAt: String!
}

extend type Query {
  "Returns credential store status."
  credentialStoreStatus: CredentialStoreStatus!
  "Returns credential metadata."
  credentials: [CredentialMetadata!]!
}

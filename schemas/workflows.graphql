    "Identifier of the resource to return or affect."
    id: ID!
    "Whether the affected resource should be archived."
    archived: Boolean!
  ): Workflow!
  "Deletes a workflow and reports whether the operation succeeded."
  deleteWorkflow(
    "Identifier of the resource to return or affect."
    id: ID!
  ): Boolean!
  "Archives workflow runs and returns the number of affected records."
  archiveWorkflowRuns(
    "Identifiers of the resources to return or affect."
    ids: [ID!]!
    "Whether the affected resource should be archived."
    archived: Boolean!
  ): Int!
  "Deletes workflow runs and returns the number of deleted records."
  deleteWorkflowRuns(
    "Identifiers of the resources to return or affect."
    ids: [ID!]!
  ): Int!
  "Triggers a workflow and returns a workflow run."
  triggerWorkflow(
    "Values for the requested operation."
    input: TriggerWorkflowInput!
  ): WorkflowRun!
  "Pauses a workflow run and returns a workflow run."
  pauseWorkflowRun(
    "Identifier of the resource to return or affect."
    id: ID!
  ): WorkflowRun!
  "Resumes a workflow run and returns a workflow run."
  resumeWorkflowRun(
    "Identifier of the resource to return or affect."
    id: ID!
  ): WorkflowRun!
  "Cancels a workflow run and returns a workflow run."
  cancelWorkflowRun(
    "Identifier of the resource to return or affect."
    id: ID!
  ): WorkflowRun!
  "Repairs workflow run data and returns a workflow run."
  repairWorkflowRunData(
    "Identifier of the resource to return or affect."
    id: ID!
    "The patch used to filter or perform the operation."
    patch: JSON!
  ): WorkflowRun!
  "Answers a workflow question and returns a workflow run."
  answerWorkflowQuestion(
    "Identifier of the batch."
    batchId: ID!
    "The answers used to filter or perform the operation."
    answers: JSON!
  ): WorkflowRun!
  "Replays a workflow run and returns a workflow run."
  replayWorkflowRun(
    "Identifier of the run."
    runId: ID!
    "Identifier of the node."
    nodeId: ID!
    "Whether restore applies to the operation. Defaults to `false`."
    restore: Boolean = false
    "Whether stash applies to the operation. Defaults to `false`."
    stash: Boolean = false
  ): WorkflowRun!
}

extend type Subscription {
  "Emits a workflow whenever workflows change."
  workflowsChanged: Workflow
  "Emits a workflow run whenever workflow run changes."
  workflowRunChanged("Identifier of the run." runId: ID!): WorkflowRun!
  "Emits a workflow run event whenever workflow run event is added."
  workflowRunEventAdded("Identifier of the run." runId: ID!): WorkflowRunEvent!
  "Emits a run question batch whenever workflow question changes."
  workflowQuestionChanged(
    "Identifier of the run."
    runId: ID!
  ): RunQuestionBatch!
}

"Operating mode for a hosted SSE endpoint."
enum SseEndpointMode {
  "forward enum value."
  FORWARD
  "mock enum value."
  MOCK
  "breakpoint enum value."
  BREAKPOINT
}

"How unnamed SSE data is grouped."
enum SseBufferMode {
  "standard enum value."
  STANDARD
  "concatenate enum value."
  CONCATENATE
  "preserve frames enum value."
  PRESERVE_FRAMES
}

"Behavior after a mock composition reaches its final block."
enum SseMockCompletion {
  "close enum value."
  CLOSE
  "hold enum value."
  HOLD
  "loop enum value."
  LOOP
}

"Kind of block in a saved SSE mock composition."
enum SseMockBlockKind {
  "event enum value."
  EVENT
  "delay enum value."
  DELAY
  "script enum value."
  SCRIPT
}

"Available SSE history table granularities."
enum SseHistoryView {
  "streams enum value."
  STREAMS
  "events enum value."
  EVENTS
}

"Stage of an SSE event retained in history."
enum SseHistoryEventStage {
  "source enum value."
  SOURCE
  "emitted enum value."
  EMITTED
  "dropped enum value."
  DROPPED
}

"An ordered HTTP header that preserves duplicate values."
type SseHeader {
  "name field."
  name: String!
  "value field."
  value: String!
}

"A reusable event in an endpoint's mock library."
type SseMockEventTemplate {
  "id field."

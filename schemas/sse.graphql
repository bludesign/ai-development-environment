extend type Query {
  "sse endpoints field."
  sseEndpoints(
    "request origin input value."
    requestOrigin: String
  ): [SseEndpoint!]!
  "Return a cursor-paginated page of hosted SSE endpoints."
  sseEndpointPage(
    "Maximum nodes to return."
    first: Int = 100
    "Cursor returned by the previous page."
    after: String
    "Origin used to build absolute public endpoint URLs."
    requestOrigin: String
  ): SseEndpointPage!
  "sse endpoint field."
  sseEndpoint(
    "id input value."
    id: ID!
    "request origin input value."
    requestOrigin: String
  ): SseEndpoint
  "sse mock event templates field."
  sseMockEventTemplates(
    "endpoint id input value."
    endpointId: ID!
  ): [SseMockEventTemplate!]!
  "Return a cursor-paginated endpoint-scoped template library."
  sseMockEventTemplatePage(
    "Endpoint that owns the templates."
    endpointId: ID!
    "Maximum nodes to return."
    first: Int = 100
    "Cursor returned by the previous page."
    after: String
  ): SseMockEventTemplatePage!
  "sse mock compositions field."
  sseMockCompositions(
    "endpoint id input value."
    endpointId: ID!
  ): [SseMockComposition!]!
  "Return a cursor-paginated endpoint-scoped mock library."
  sseMockCompositionPage(
    "Endpoint that owns the compositions."
    endpointId: ID!
    "Maximum nodes to return."
    first: Int = 100
    "Cursor returned by the previous page."
    after: String
  ): SseMockCompositionPage!
  "sse storage entries field."
  sseStorageEntries: [SseStorageEntry!]!
  "Return a cursor-paginated page of shared global storage."
  sseStorageEntryPage(
    "Maximum nodes to return."
    first: Int = 100
    "Cursor returned by the previous page."
    after: String
  ): SseStorageEntryPage!
  "sse breakpoints field."
  sseBreakpoints("status input value." status: String): [SseBreakpoint!]!
  "Return a cursor-paginated page of pending or resolved breakpoints."
  sseBreakpointPage(
    "Optional breakpoint status filter."
    status: String
    "Maximum nodes to return."
    first: Int = 100
    "Cursor returned by the previous page."
    after: String
  ): SseBreakpointPage!
  "sse history field."
  sseHistory("input input value." input: SseHistoryQueryInput!): SseHistoryPage!
  "sse history request field."
  sseHistoryRequest("id input value." id: ID!): SseRequestHistory
  "sse history facets field."
  sseHistoryFacets: JSON!
  "Return cursor-paginated endpoint, mode, status, and event-name facets."
  sseHistoryFacetPage(
    "Maximum nodes to return."
    first: Int = 100
    "Cursor returned by the previous page."
    after: String
  ): SseHistoryFacetPage!
  "sse history view settings field."
  sseHistoryViewSettings(
    "view input value."
    view: SseHistoryView!
  ): SseHistoryViewSettings!
  "sse history column presets field."
  sseHistoryColumnPresets(
    "view input value."
    view: SseHistoryView!
  ): [SseHistoryColumnPreset!]!
  "Return cursor-paginated history column presets for a view."
  sseHistoryColumnPresetPage(
    "History view that owns the presets."
    view: SseHistoryView!
    "Maximum nodes to return."
    first: Int = 100
    "Cursor returned by the previous page."
    after: String
  ): SseHistoryColumnPresetPage!
  "sse history saved filters field."
  sseHistorySavedFilters(
    "view input value."
    view: SseHistoryView!
  ): [SseHistorySavedFilter!]!
  "Return cursor-paginated saved history filters for a view."
  sseHistorySavedFilterPage(
    "History view that owns the filters."
    view: SseHistoryView!
    "Maximum nodes to return."
    first: Int = 100
    "Cursor returned by the previous page."
    after: String
  ): SseHistorySavedFilterPage!
}


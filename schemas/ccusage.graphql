extend type Query {
  "Returns a Claude Code usage collection, or null when it cannot be found."
  ccusageCollection(
    "Identifier of the resource to return or affect."
    id: ID!
  ): CcusageCollection
}

extend type Mutation {
  "Collects Claude Code usage and returns a Claude Code usage collection."
  collectCcusage("Identifier of the request." requestId: ID): CcusageCollection!
}

extend type Subscription {
  "Emits a Claude Code usage collection whenever Claude Code usage collection changes."
  ccusageCollectionChanged(
    "Identifier of the resource to return or affect."
    id: ID!
  ): CcusageCollection!
}

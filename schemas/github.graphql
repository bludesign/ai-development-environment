  saveGitHubSettings(
    "Values for the requested operation."
    input: SaveGitHubSettingsInput!
  ): GitHubSettings!
  "Updates a GitHub cache TTL and returns the updated GitHub settings."
  updateGitHubCacheTtl(
    "The TTL minutes used to filter or perform the operation."
    ttlMinutes: Int!
  ): GitHubSettings!
  "Saves a GitHub cache TTL override and returns the updated GitHub cache TTL override."
  saveGitHubCacheTtlOverride(
    "Values for the requested operation."
    input: SaveGitHubCacheTtlOverrideInput!
  ): GitHubCacheTtlOverride!
  "Deletes a GitHub cache TTL override and reports whether the operation succeeded."
  deleteGitHubCacheTtlOverride(
    "The operation used to filter or perform the operation."
    operation: String!
  ): Boolean!
  "Clears a GitHub cache and reports whether the operation succeeded."
  clearGitHubCache: Boolean!
  "Clears GitHub API calls and reports whether the operation succeeded."
  clearGitHubApiCalls: Boolean!
  "Clears GitHub webhook deliveries and reports whether the operation succeeded."
  clearGitHubWebhookDeliveries: Boolean!
  "Refreshes a GitHub cached entry and returns a GitHub cached entry detail."
  refreshGitHubCachedEntry(
    "Identifier of the resource to return or affect."
    id: ID!
  ): GitHubCachedEntryDetail!
  "Deletes a GitHub cached entry and reports whether the operation succeeded."
  deleteGitHubCachedEntry(
    "Identifier of the resource to return or affect."
    id: ID!
  ): Boolean!
  "Saves GitHub app settings and returns the updated GitHub app settings."
  saveGitHubAppSettings(
    "Values for the requested operation."
    input: SaveGitHubAppSettingsInput!
  ): GitHubAppSettings!
  "Tests a GitHub connection and returns a GitHub viewer."
  testGitHubConnection: GitHubViewer!
  "Tests a GitHub app connection and returns GitHub app settings."
  testGitHubAppConnection: GitHubAppSettings!
  "Clears GitHub credentials and returns GitHub settings."
  clearGitHubCredentials: GitHubSettings!
  "Clears GitHub app credentials and returns GitHub app settings."
  clearGitHubAppCredentials: GitHubAppSettings!
  "Adds a GitHub repository and returns GitHub repositories."
  addGitHubRepository(
    "Values for the requested operation."
    input: AddGitHubRepositoryInput!
  ): [GitHubRepository!]!
  "Updates a GitHub repository and returns the updated GitHub repository."
  updateGitHubRepository(
    "Values for the requested operation."
    input: UpdateGitHubRepositoryInput!
  ): [GitHubRepository!]!
  "Removes a GitHub repository and returns GitHub repositories."
  removeGitHubRepository(
    "Identifier of the resource to return or affect."
    id: ID!
  ): [GitHubRepository!]!
  "Merges a GitHub pull request and returns a GitHub pull request merge result."
  mergeGitHubPullRequest(
    "Values for the requested operation."
    input: MergeGitHubPullRequestInput!
    "The source used to filter or perform the operation."
    source: GitHubRequestSource!
  ): GitHubPullRequestMergeResult!
  "Creates a GitHub pull request and returns a GitHub pull request detail."
  createGitHubPullRequest(
    "Values for the requested operation."
    input: CreateGitHubPullRequestInput!
  ): GitHubPullRequestDetail!
  "Sets GitHub pull request labels and returns the updated GitHub pull request detail."
  setGitHubPullRequestLabels(
    "Values for the requested operation."
    input: SetGitHubPullRequestLabelsInput!
  ): GitHubPullRequestDetail!
  "Retries a GitHub pipeline and returns a GitHub pipeline."
  retryGitHubPipeline(
    "Identifier of the repository."
    repositoryId: ID!
    "Identifier of the check suite."
    checkSuiteId: ID!
    "The source used to filter or perform the operation."
    source: GitHubRequestSource!
  ): GitHubPipeline!
  "Retries a GitHub workflow job and reports whether the operation succeeded."
  retryGitHubWorkflowJob(
    "Identifier of the repository."
    repositoryId: ID!
    "Identifier of the check suite."
    checkSuiteId: ID!
    "Identifier of the job."
    jobId: ID!
    "The source used to filter or perform the operation."
    source: GitHubRequestSource!
  ): Boolean!
  "Cancels a GitHub actions workflow run and reports whether the operation succeeded."
  cancelGitHubActionsWorkflowRun(
    "Identifier of the codebase repository."
    codebaseRepositoryId: ID!
    "Identifier of the workflow run."
    workflowRunId: ID!
    "Whether force applies to the operation. Defaults to `false`."
    force: Boolean! = false
    "The source used to filter or perform the operation."
    source: GitHubRequestSource!
  ): Boolean!
  "Saves a GitHub auto retry rule and returns the updated GitHub auto retry rule."
  saveGitHubAutoRetryRule(
    "Values for the requested operation."
    input: SaveGitHubAutoRetryRuleInput!
  ): GitHubAutoRetryRule!
  "Sets whether GitHub auto retry rule is enabled and returns the updated GitHub auto retry rule."
  setGitHubAutoRetryRuleEnabled(
    "Identifier of the resource to return or affect."
    id: ID!
    "Whether enabled applies to the operation."
    enabled: Boolean!
  ): GitHubAutoRetryRule!
  "Deletes a GitHub auto retry rule and reports whether the operation succeeded."
  deleteGitHubAutoRetryRule(
    "Identifier of the resource to return or affect."
    id: ID!
  ): Boolean!
  "Replies to a GitHub review thread and returns a GitHub review comment."
  replyToGitHubReviewThread(
    "Identifier of the thread."
    threadId: ID!
    "The body used to filter or perform the operation."
    body: String!
  ): GitHubReviewComment!
  "Sets whether GitHub review thread is resolved and returns the updated GitHub review thread state."
  setGitHubReviewThreadResolved(
    "Identifier of the thread."
    threadId: ID!
    "Whether resolved applies to the operation."
    resolved: Boolean!
  ): GitHubReviewThreadState!
}

}

extend type Query {
  githubSettings: GitHubSettings!
  githubCacheTtlOverrides: [GitHubCacheTtlOverride!]!
  githubCacheableGraphqlOperations: [String!]!
  githubRateLimitSnapshots: [GitHubRateLimitSnapshot!]!
  githubCacheMetrics: GitHubCacheMetrics!
  githubApiCalls(
    limit: Int = 50
    offset: Int = 0
    apiType: GitHubApiType
    requestSource: GitHubRequestSource
    source: GitHubCallSource
  ): GitHubApiCallPage!
  githubCachedEntries(limit: Int = 50, offset: Int = 0): GitHubCachedEntryPage!
  githubCachedEntry(id: ID!): GitHubCachedEntryDetail
  githubAppSettings: GitHubAppSettings!
  githubRepositories: [GitHubRepository!]!
  githubAvailableRepositories(after: String): GitHubRepositoryCandidatePage!
  githubActionsWorkflowRuns(
    source: GitHubRequestSource!
    codebaseRepositoryId: ID
    branch: String
    workflowId: ID
    first: Int = 25
    after: String
  ): GitHubActionsWorkflowRunPage!
  githubActionsWorkflowJobs(
    source: GitHubRequestSource!
    codebaseRepositoryId: ID!
    workflowRunId: ID!
  ): [GitHubWorkflowJob!]!
  githubActionsWorkflowRunAttempt(
    source: GitHubRequestSource!
    repositoryId: ID!
    workflowRunId: ID!
    attempt: Int!
  ): GitHubWorkflowRunAttempt!
  githubWorktreeWorkflowRuns(worktreeId: ID!): [GitHubActionsWorkflowRun!]!
  githubRepositoryWorkflows(
    source: GitHubRequestSource!
    codebaseRepositoryId: ID!
  ): [GitHubRepositoryWorkflow!]!
  githubAutoRetryRules(
    codebaseRepositoryId: ID
    workflowRunId: ID
  ): [GitHubAutoRetryRule!]!
  githubPullRequests(
    source: GitHubRequestSource!
    scope: GitHubPullRequestScope!
    repositoryId: ID
    state: GitHubPullRequestStateFilter = OPEN
    first: Int = 25
    after: String
  ): GitHubPullRequestPage!
  githubPullRequest(
    owner: String!
    name: String!
    number: Int!
  ): GitHubPullRequestDetail
  githubPullRequestMergeOptions(
    source: GitHubRequestSource!
    owner: String!
    name: String!
    number: Int!
  ): GitHubPullRequestMergeOptions!
  githubReviewThreads: GitHubReviewThreadPage!
  githubPipelineStatuses(
    keys: [GitHubPipelineStatusKeyInput!]!
  ): [GitHubPipelineStatusSnapshot!]!
  githubPipelineRecords(
    keys: [GitHubPipelineRecordKeyInput!]!
  ): [GitHubPipelineRecord!]!
}

extend type Subscription {
  githubPipelineStatusChanged: GitHubPipelineStatusChanged!
}

extend type Mutation {
  saveGitHubSettings(input: SaveGitHubSettingsInput!): GitHubSettings!
  updateGitHubCacheTtl(ttlMinutes: Int!): GitHubSettings!
  saveGitHubCacheTtlOverride(
    input: SaveGitHubCacheTtlOverrideInput!
  ): GitHubCacheTtlOverride!
  deleteGitHubCacheTtlOverride(operation: String!): Boolean!
  clearGitHubCache: Boolean!
  clearGitHubApiCalls: Boolean!
  refreshGitHubCachedEntry(id: ID!): GitHubCachedEntryDetail!
  deleteGitHubCachedEntry(id: ID!): Boolean!
  saveGitHubAppSettings(input: SaveGitHubAppSettingsInput!): GitHubAppSettings!
  testGitHubConnection: GitHubViewer!
  testGitHubAppConnection: GitHubAppSettings!
  clearGitHubCredentials: GitHubSettings!
  clearGitHubAppCredentials: GitHubAppSettings!
  addGitHubRepository(input: AddGitHubRepositoryInput!): [GitHubRepository!]!
  updateGitHubRepository(
    input: UpdateGitHubRepositoryInput!
  ): [GitHubRepository!]!
  removeGitHubRepository(id: ID!): [GitHubRepository!]!
  mergeGitHubPullRequest(
    input: MergeGitHubPullRequestInput!
    source: GitHubRequestSource!
  ): GitHubPullRequestMergeResult!
  createGitHubPullRequest(
    input: CreateGitHubPullRequestInput!
  ): GitHubPullRequestDetail!
  setGitHubPullRequestLabels(
    input: SetGitHubPullRequestLabelsInput!
  ): GitHubPullRequestDetail!
  retryGitHubPipeline(
    repositoryId: ID!
    checkSuiteId: ID!
    source: GitHubRequestSource!
  ): GitHubPipeline!
  retryGitHubWorkflowJob(
    repositoryId: ID!
    checkSuiteId: ID!
    jobId: ID!
    source: GitHubRequestSource!
  ): Boolean!
  cancelGitHubActionsWorkflowRun(
    codebaseRepositoryId: ID!
    workflowRunId: ID!
    force: Boolean! = false
    source: GitHubRequestSource!
  ): Boolean!
  saveGitHubAutoRetryRule(
    input: SaveGitHubAutoRetryRuleInput!
  ): GitHubAutoRetryRule!
  setGitHubAutoRetryRuleEnabled(
    id: ID!
    enabled: Boolean!
  ): GitHubAutoRetryRule!
  deleteGitHubAutoRetryRule(id: ID!): Boolean!
  replyToGitHubReviewThread(threadId: ID!, body: String!): GitHubReviewComment!
  setGitHubReviewThreadResolved(
    threadId: ID!
    resolved: Boolean!
  ): GitHubReviewThreadState!
}

  NONE
}

enum GitHubMergeMethod {
  MERGE
  REBASE
  SQUASH
}

enum GitHubPipelineRetryUnavailableReason {
  GITHUB_APP_NOT_CONFIGURED
  NOT_COMPLETED
  NOT_GITHUB_ACTIONS
  WORKFLOW_RUN_UNAVAILABLE
  HISTORICAL_ATTEMPT
}

enum GitHubAuthentication {
  PAT
  APP
}

enum GitHubCallSource {
  LIVE
  CACHE
  ERROR
}

enum GitHubApiType {
  GRAPHQL
  REST
}

enum GitHubRequestSource {

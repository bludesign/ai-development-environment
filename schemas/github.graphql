enum GitHubPullRequestScope {
  MINE
  REVIEW_REQUESTED
  REPOSITORY
}

enum GitHubPullRequestState {
  OPEN
  CLOSED
  MERGED
}

enum GitHubPullRequestStateFilter {
  ALL
  OPEN
  CLOSED
  MERGED
}

enum GitHubPipelineStatus {
  ERROR
  EXPECTED
  FAILURE
  PENDING
  SUCCESS
  NONE
}

enum GitHubPipelineState {
  ACTION_REQUIRED
  CANCELLED
  ERROR
  EXPECTED
  FAILURE
  IN_PROGRESS
  NEUTRAL
  PENDING
  QUEUED
  SKIPPED
  STALE
  STARTUP_FAILURE
  SUCCESS
  TIMED_OUT
  NONE
}

enum GitHubReviewDecision {
  APPROVED
  CHANGES_REQUESTED

input SaveGitHubSettingsInput {
  apiToken: String
  defaultJiraKeyRegex: String
  actionsNotificationPollIntervalSeconds: Int
}

input SaveGitHubCacheTtlOverrideInput {
  operation: String!
  ttlSeconds: Int!
}

input SaveGitHubAppSettingsInput {
  appId: String!
  installationId: String!
  privateKey: String
  webhookUrl: String
  enhancedPipelineWebhooksEnabled: Boolean
}

input AddGitHubRepositoryInput {
  nameWithOwner: String!
  jiraKeyRegex: String
}

input UpdateGitHubRepositoryInput {
  id: ID!
  jiraKeyRegex: String
}

input MergeGitHubPullRequestInput {
  owner: String!
  name: String!
  number: Int!
  method: GitHubMergeMethod!
  commitHeadline: String!
  commitBody: String!
  authorEmail: String
}

input CreateGitHubPullRequestInput {
  owner: String!
  name: String!
  baseRefName: String!
  headRefName: String!
  title: String!
  body: String

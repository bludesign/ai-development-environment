  "ISO 8601 timestamp when this agent codebase registration was last fetched. May be null when unavailable or not applicable."
  lastFetchedAt: String
  "ISO 8601 timestamp when this agent codebase registration last fetch attempt. May be null when unavailable or not applicable."
  lastFetchAttemptAt: String
  "Worktrees associated with this agent codebase registration."

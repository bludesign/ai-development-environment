"Represents a codebase operation skip in the GraphQL API."
type CodebaseOperationSkip {
  "Identifier of the related codebase."
  codebaseId: ID!
  "The reason associated with this codebase operation skip."
  reason: String!
}

"A batch of codebase operations processed together."
type CodebaseOperationBatch {
  "Jobs associated with this codebase operation batch."
  jobs: [AgentJob!]!
  "Skippeds associated with this codebase operation batch."
  skipped: [CodebaseOperationSkip!]!
}

"Represents a codebase removal in the GraphQL API."
type CodebaseRemoval {
  "Stable identifier for this codebase removal."
  id: ID!
  "Identifier of the related repository."
  repositoryId: ID!
  "Whether the repository removed condition is true for this codebase removal."
  repositoryRemoved: Boolean!
}

"Represents a codebase overview change in the GraphQL API."
type CodebaseOverviewChange {
  "Identifier of the related codebase. May be null when unavailable or not applicable."
  codebaseId: ID
  "Identifier of the related repository. May be null when unavailable or not applicable."
  repositoryId: ID
}

"Represents a codebase git branch in the GraphQL API."
type CodebaseGitBranch {
  "Display name of this codebase git branch."
  name: String!
  "Whether the local condition is true for this codebase git branch."
  local: Boolean!
  "Whether the remote condition is true for this codebase git branch."
  remote: Boolean!
  "Whether the current condition is true for this codebase git branch."
  current: Boolean!
  "Filesystem path associated with this codebase git branch. May be null when unavailable or not applicable."
  checkedOutPath: String
  "The last commit message associated with this codebase git branch. May be null when unavailable or not applicable."
  lastCommitMessage: String
  "ISO 8601 timestamp when this codebase git branch last commit. May be null when unavailable or not applicable."
  lastCommitAt: String
}

"Represents a codebase stash in the GraphQL API."
type CodebaseStash {
  "The oid associated with this codebase stash."
  oid: ID!
  "The selector associated with this codebase stash."
  selector: String!
  "Human-readable message associated with this codebase stash."
  message: String!
  "ISO 8601 timestamp when this codebase stash was created."
  createdAt: String!
}

"Represents a codebase git state in the GraphQL API."
type CodebaseGitState {
  "Whether the dirty condition is true for this codebase git state."

  "Whether this agent codebase registration can onical origin."
  canonicalOrigin: String!
  "Git branch associated with this agent codebase registration. May be null when unavailable or not applicable."
  defaultBranch: String
  "Whether the keep base branch up to date condition is true for this agent codebase registration."

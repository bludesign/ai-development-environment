"States reported for codebase sync."
enum CodebaseSyncState {
  "Represents the in sync state for codebase sync."
  IN_SYNC
  "Represents the ahead state for codebase sync."
  AHEAD
  "Represents the behind state for codebase sync."
  BEHIND
  "Represents the diverged state for codebase sync."
  DIVERGED
  "Represents the no upstream state for codebase sync."
  NO_UPSTREAM
  "Represents the detached state for codebase sync."
  DETACHED
  "The codebase sync is not known."
  UNKNOWN
}

"Values supported for codebase availability."
enum CodebaseAvailability {
  "Represents the available option."
  AVAILABLE
  "Represents the missing option."
  MISSING
  "Represents the not repository option."
  NOT_REPOSITORY
  "Represents the origin mismatch option."
  ORIGIN_MISMATCH
  "Represents the error option."
  ERROR
}

"Values supported for codebase git operation."
enum CodebaseGitOperation {
  "Represents the switch branch option."
  SWITCH_BRANCH
  "Represents the delete branch option."
  DELETE_BRANCH
  "Represents the delete remote branch option."
  DELETE_REMOTE_BRANCH
  "Represents the pull branch option."
  PULL_BRANCH
  "Represents the apply stash option."
  APPLY_STASH
  "Represents the delete stash option."
  DELETE_STASH
}

"Kinds of repository preparation applied to worktrees."
enum RepositoryPreparationKind {
  "Writes uploaded bytes to the configured path."
  WRITE
  "Removes the configured path."
  DELETE
  "Marks a tracked path assumed unchanged without changing its contents."
  ASSUME_UNCHANGED
}

"A repository preparation definition."
type RepositoryPreparation {
  "Stable identifier for this preparation."
  id: ID!
  "Identifier of the repository that owns this preparation."
  repositoryId: ID!
  "The operation performed for this preparation."
  kind: RepositoryPreparationKind!
  "Exact repository-relative POSIX file path."
  path: String!
  "SHA-256 of uploaded contents for write preparations."
  contentSha256: String
  "Uploaded content size for write preparations."
  byteCount: Int
  "Hash of all behavior-affecting fields."
  definitionHash: String!
  "ISO 8601 timestamp when this preparation was created."
  createdAt: String!
  "ISO 8601 timestamp when this preparation was updated."
  updatedAt: String!
}

"Represents a codebase repository in the GraphQL API."
type CodebaseRepository {
  "Stable identifier for this codebase repository."
  id: ID!
  "Whether this codebase repository can onical origin."
  canonicalOrigin: String!
  "The display origin associated with this codebase repository."
  displayOrigin: String!
  "Display name of this codebase repository."
  name: String!
  "Human-readable description of this codebase repository."
  description: String!
  "The Jira branch regex associated with this codebase repository. May be null when unavailable or not applicable."
  jiraBranchRegex: String
  "Whether the keep base branch up to date condition is true for this codebase repository."
  keepBaseBranchUpToDate: Boolean!
  "Skill groups associated with this codebase repository."
  skillGroups: [SkillGroup!]!
  "Quick action workflows associated with this codebase repository."
  quickActionWorkflows: [Workflow!]!
  "Codebases associated with this codebase repository."
  codebases: [Codebase!]!
  "Preparations applied to worktrees for this repository."
  preparations: [RepositoryPreparation!]!
  "ISO 8601 timestamp when this codebase repository was created."
  createdAt: String!
  "ISO 8601 timestamp when this codebase repository was last updated."
  updatedAt: String!
}

"Represents a codebase in the GraphQL API."
type Codebase {
  "Stable identifier for this codebase."
  id: ID!
  "The folder associated with this codebase."
  folder: String!
  "The observed origin associated with this codebase."
  observedOrigin: String!
  "Git branch associated with this codebase. May be null when unavailable or not applicable."
  branch: String
  "Git commit SHA associated with this codebase. May be null when unavailable or not applicable."
  headSha: String
  "The upstream associated with this codebase. May be null when unavailable or not applicable."
  upstream: String
  "The ahead associated with this codebase. May be null when unavailable or not applicable."
  ahead: Int
  "The behind associated with this codebase. May be null when unavailable or not applicable."
  behind: Int
  "The sync state associated with this codebase."
  syncState: CodebaseSyncState!
  "The availability associated with this codebase."
  availability: CodebaseAvailability!
  "The status error associated with this codebase. May be null when unavailable or not applicable."
  statusError: String
  "Git branch associated with this codebase. May be null when unavailable or not applicable."
  defaultBranch: String
  "Local branches associated with this codebase."
  localBranches: [String!]!
  "Remote branches associated with this codebase."
  remoteBranches: [String!]!
  "ISO 8601 timestamp when this codebase was last checked. May be null when unavailable or not applicable."
  lastCheckedAt: String
  "ISO 8601 timestamp when this codebase was last fetched. May be null when unavailable or not applicable."
  lastFetchedAt: String
  "ISO 8601 timestamp when this codebase last fetch attempt. May be null when unavailable or not applicable."
  lastFetchAttemptAt: String
  "The last fetch error associated with this codebase. May be null when unavailable or not applicable."
  lastFetchError: String
  "ISO 8601 timestamp when this codebase was created."
  createdAt: String!
  "ISO 8601 timestamp when this codebase was last updated."
  updatedAt: String!
  "The agent associated with this codebase."
  agent: Agent!
  "The repository associated with this codebase."
  repository: CodebaseRepository!
  "The active job associated with this codebase. May be null when unavailable or not applicable."
  activeJob: AgentJob
}

"Represents a codebase directory entry in the GraphQL API."
type CodebaseDirectoryEntry {
  "Display name of this codebase directory entry."
  name: String!
  "Filesystem path associated with this codebase directory entry."
  path: String!
  "Whether the hidden condition is true for this codebase directory entry."
  hidden: Boolean!
}

"Represents a codebase directory listing in the GraphQL API."
type CodebaseDirectoryListing {
  "Filesystem path associated with this codebase directory listing."
  path: String!
  "Filesystem path associated with this codebase directory listing. May be null when unavailable or not applicable."
  parentPath: String
  "Filesystem path associated with this codebase directory listing."
  homePath: String!
  "Entries associated with this codebase directory listing."
  entries: [CodebaseDirectoryEntry!]!
  "Whether this codebase directory listing is truncated."
  truncated: Boolean!
}

"Represents a codebase snapshot in the GraphQL API."
type CodebaseSnapshot {
  "The folder associated with this codebase snapshot."
  folder: String!
  "The observed origin associated with this codebase snapshot. May be null when unavailable or not applicable."
  observedOrigin: String
  "Whether this codebase snapshot can onical origin."
  canonicalOrigin: String
  "The display origin associated with this codebase snapshot. May be null when unavailable or not applicable."
  displayOrigin: String
  "Git branch associated with this codebase snapshot. May be null when unavailable or not applicable."
  branch: String
  "Git commit SHA associated with this codebase snapshot. May be null when unavailable or not applicable."
  headSha: String
  "The upstream associated with this codebase snapshot. May be null when unavailable or not applicable."
  upstream: String
  "The ahead associated with this codebase snapshot. May be null when unavailable or not applicable."
  ahead: Int
  "The behind associated with this codebase snapshot. May be null when unavailable or not applicable."
  behind: Int
  "The sync state associated with this codebase snapshot."
  syncState: CodebaseSyncState!
  "The availability associated with this codebase snapshot."
  availability: CodebaseAvailability!
  "Error message when this codebase snapshot did not complete successfully. May be null when unavailable or not applicable."
  error: String
  "ISO 8601 timestamp when this codebase snapshot was checked."
  checkedAt: String!
  "ISO 8601 timestamp when this codebase snapshot was fetched. May be null when unavailable or not applicable."
  fetchedAt: String
  "Whether the linked worktree condition is true for this codebase snapshot."
  linkedWorktree: Boolean!
}

"Represents a codebase inspection in the GraphQL API."
type CodebaseInspection {
  "Identifier of the related job."
  jobId: ID!
  "The snapshot associated with this codebase inspection."
  snapshot: CodebaseSnapshot!
  "The existing repository associated with this codebase inspection. May be null when unavailable or not applicable."
  existingRepository: CodebaseRepository
}

"Represents a codebase overview in the GraphQL API."
type CodebaseOverview {
  "Repositories associated with this codebase overview."
  repositories: [CodebaseRepository!]!
}

"Configurable settings for codebase."
type CodebaseSettings {
  "Refresh interval, in seconds."
  refreshIntervalSeconds: Int!
  "Fetch interval, in seconds."
  fetchIntervalSeconds: Int!
  "The default Jira branch regex associated with this codebase settings."
  defaultJiraBranchRegex: String!
  "ISO 8601 timestamp when this codebase settings was last updated."
  updatedAt: String!
}

"Represents an agent codebase registration in the GraphQL API."
type AgentCodebaseRegistration {
  "Stable identifier for this agent codebase registration."

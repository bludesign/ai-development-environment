  branches: [CodebaseGitBranch!]!
  "Whether the branches truncated condition is true for this codebase git state."
  branchesTruncated: Boolean!
  "Stashes associated with this codebase git state."
  stashes: [CodebaseStash!]!
  "Whether the stashes truncated condition is true for this codebase git state."
  stashesTruncated: Boolean!
}

"Represents a codebase stash diff in the GraphQL API."
type CodebaseStashDiff {
  "The oid associated with this codebase stash diff."
  oid: ID!
  "The patch associated with this codebase stash diff."
  patch: String!
  "Whether this codebase stash diff is truncated."
  truncated: Boolean!
}

"Values used to browse an agent directory."
input BrowseAgentDirectoryInput {
  "Identifier of the agent to use."
  agentId: ID!
  "The path to use for the request."
  path: String
  "Identifier of the request to use."
  requestId: ID!
}

"Values used to inspect an agent codebase."
input InspectAgentCodebaseInput {
  "Identifier of the agent to use."
  agentId: ID!
  "The folder to use for the request."
  folder: String!
  "Identifier of the request to use."
  requestId: ID!
}

"Values used to confirm a codebase."
input ConfirmCodebaseInput {
  "Identifier of the inspection job to use."
  inspectionJobId: ID!
  "The name to use for the request."
  name: String
  "The description to use for the request."
  description: String
}

"Values used to update a codebase repository."
input UpdateCodebaseRepositoryInput {
  "Identifier of the update codebase repository to affect."
  id: ID!
  "The name to use for the request."
  name: String!
  "The description to use for the request."
  description: String!
  "The Jira branch regex to use for the request."
  jiraBranchRegex: String
  "Whether keep base branch up to date applies to the request."
  keepBaseBranchUpToDate: Boolean!
  "Identifiers of the skill groups to use."
  skillGroupIds: [ID!]
}

"One preparation saved for a repository."
input SaveRepositoryPreparationInput {
  "Existing preparation identifier. Omit when adding a preparation."
  id: ID
  "The operation performed for this preparation."
  kind: RepositoryPreparationKind!
  "Exact repository-relative POSIX file path."
  path: String!
  "Base64-encoded bytes for a new or replaced write preparation."
  contentBase64: String
}

"Values used to replace a repository's preparation definitions."
input SaveCodebaseRepositoryPreparationsInput {
  "Identifier of the repository to update."
  repositoryId: ID!
  "Complete desired preparation list."
  preparations: [SaveRepositoryPreparationInput!]!
}

"Values used to update codebase settings."
input UpdateCodebaseSettingsInput {
  "Refresh interval in seconds."
  refreshIntervalSeconds: Int!
  "Fetch interval in seconds."
  fetchIntervalSeconds: Int!
  "The default Jira branch regex to use for the request."
  defaultJiraBranchRegex: String!
}

"Values used to run a codebase operation."
input RunCodebaseOperationInput {
  "Identifiers of the codebases to use."
  codebaseIds: [ID!]!
  "Identifier of the request to use."
  requestId: ID!
}

"Values used to inspect a codebase git state."
input InspectCodebaseGitStateInput {
  "Identifier of the codebase to use."
  codebaseId: ID!
  "Identifier of the request to use."
  requestId: ID!
}

"Values used to inspect a codebase stash."
input InspectCodebaseStashInput {
  "Identifier of the codebase to use."
  codebaseId: ID!
  "The stash oid to use for the request."
  stashOid: ID!
  "Identifier of the request to use."
  requestId: ID!
}

"Values used to run a codebase git operation."
input RunCodebaseGitOperationInput {
  "Identifier of the codebase to use."
  codebaseId: ID!
  "The operation to use for the request."
  operation: CodebaseGitOperation!
  "The branch to use for the request."
  branch: String
  "The stash oid to use for the request."
  stashOid: ID
  "Whether stash changes applies to the request."
  stashChanges: Boolean = false
  "Identifier of the request to use."
  requestId: ID!
}

"Input values for codebase snapshot."
input CodebaseSnapshotInput {
  "The folder to use for the request."
  folder: String!
  "The observed origin to use for the request."
  observedOrigin: String
  "The canonical origin to use for the request."
  canonicalOrigin: String
  "The display origin to use for the request."
  displayOrigin: String
  "The branch to use for the request."
  branch: String
  "The head SHA to use for the request."
  headSha: String
  "The upstream to use for the request."
  upstream: String
  "The ahead to use for the request."
  ahead: Int
  "The behind to use for the request."
  behind: Int
  "The sync state to use for the request."
  syncState: CodebaseSyncState!
  "The availability to use for the request."
  availability: CodebaseAvailability!
  "The error to use for the request."
  error: String
  "The checked at to use for the request."
  checkedAt: String!
  "The fetched at to use for the request."
  fetchedAt: String
  "Whether linked worktree applies to the request."
  linkedWorktree: Boolean!
}

"Input values for codebase status report."
input CodebaseStatusReportInput {
  "Identifier of the codebase to use."
  codebaseId: ID!
  "The snapshot to use for the request."
  snapshot: CodebaseSnapshotInput!
}

extend type Query {
  "Returns a codebase overview."
  codebaseOverview: CodebaseOverview!
  "Returns a codebase repository, or null when it cannot be found."
  codebaseRepository(
    "Identifier of the resource to return or affect."
    id: ID!
  ): CodebaseRepository
  "Returns a codebase, or null when it cannot be found."
  codebase("Identifier of the resource to return or affect." id: ID!): Codebase
  "Returns codebase settings."
  codebaseSettings: CodebaseSettings!
  "Returns agent codebase registrations."
  agentCodebases: [AgentCodebaseRegistration!]!
  "Returns an agent codebase configuration."
  agentCodebaseConfiguration: AgentCodebaseConfiguration!
}

extend type Mutation {
  "Browses an agent directory and returns a codebase directory listing."
  browseAgentDirectory(
    "Values for the requested operation."
    input: BrowseAgentDirectoryInput!
  ): CodebaseDirectoryListing!
  "Inspects an agent codebase and returns a codebase inspection."
  inspectAgentCodebase(
    "Values for the requested operation."
    input: InspectAgentCodebaseInput!
  ): CodebaseInspection!
  "Confirms a codebase and returns a codebase."
  confirmCodebase(
    "Values for the requested operation."
    input: ConfirmCodebaseInput!
  ): Codebase!
  "Updates a codebase repository and returns the updated codebase repository."
  updateCodebaseRepository(
    "Values for the requested operation."
    input: UpdateCodebaseRepositoryInput!
  ): CodebaseRepository!
  "Replaces a repository's preparation definitions."
  saveCodebaseRepositoryPreparations(
    "Values for the requested operation."
    input: SaveCodebaseRepositoryPreparationsInput!
  ): CodebaseRepository!
  "Updates codebase settings and returns the updated codebase settings."
  updateCodebaseSettings(
    "Values for the requested operation."
    input: UpdateCodebaseSettingsInput!
  ): CodebaseSettings!
  "Removes a codebase and returns a codebase removal."
  removeCodebase(
    "Identifier of the resource to return or affect."
    id: ID!
  ): CodebaseRemoval!
  "Refreshes codebases and returns a codebase operation batch."
  refreshCodebases(
    "Values for the requested operation."
    input: RunCodebaseOperationInput!
  ): CodebaseOperationBatch!
  "Fetches codebases and returns a codebase operation batch."
  fetchCodebases(
    "Values for the requested operation."
    input: RunCodebaseOperationInput!
  ): CodebaseOperationBatch!
  "Inspects a codebase git state and returns a codebase git state."
  inspectCodebaseGitState(
    "Values for the requested operation."
    input: InspectCodebaseGitStateInput!
  ): CodebaseGitState!
  "Inspects a codebase stash and returns a codebase stash diff."
  inspectCodebaseStash(
    "Values for the requested operation."
    input: InspectCodebaseStashInput!
  ): CodebaseStashDiff!
  "Runs a codebase git operation and returns an agent job."
  runCodebaseGitOperation(
    "Values for the requested operation."
    input: RunCodebaseGitOperationInput!
  ): AgentJob!
  "Reports codebase statuses and returns codebases."
  reportCodebaseStatuses(
    "Reports used to filter or perform the operation."
    reports: [CodebaseStatusReportInput!]!
  ): [Codebase!]!
}

extend type Subscription {
  "Emits a codebase overview change whenever codebase overview changes."
  codebaseOverviewChanged: CodebaseOverviewChange!
}

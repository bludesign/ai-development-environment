"Values supported for worktree editor variant."
enum WorktreeEditorVariant {
  "Represents the code option."
  CODE
  "Represents the code insiders option."
  CODE_INSIDERS
  "No worktree editor variant applies."
  NONE
}

"Values supported for worktree operation."
enum WorktreeOperation {
  "Represents the open editor option."
  OPEN_EDITOR
  "Represents the force push option."
  FORCE_PUSH
  "Represents the sync option."
  SYNC
  "Represents the rebase option."
  REBASE
  "Represents the cancel rebase option."
  CANCEL_REBASE
  "Represents the pull option."
  PULL
  "Represents the push option."
  PUSH
  "Represents the reset option."
  RESET
  "Removes the selected worktree's Git index lock."
  CLEAR_LOCK
  "Represents the stash all option."
  STASH_ALL
  "Represents the stage all option."
  STAGE_ALL
  "Represents the unstage all option."
  UNSTAGE_ALL
}

"Actions supported by the worktree preparation agent job."
enum WorktreePreparationAction {
  "Inspects managed paths without changing them."
  INSPECT
  "Applies the repository preparation definitions."
  APPLY
  "Restores managed paths and clears their Git flags."
  UNDO
}

"Per-file preparation states."
enum WorktreePreparationState {
  "The current definition has not been applied yet."
  PENDING
  "The path matches its preparation definition."
  APPLIED
  "The preparation has been explicitly undone."
  UNDONE
  "The managed path no longer matches its definition."
  DRIFTED
  "The preparation is suspended while Git conflict work is active."
  SUSPENDED
  "The rule is neutral for this worktree, such as an untracked assume-only path."
  NOT_APPLICABLE
  "The latest preparation action failed for this path."
  ERROR
  "The path has not been inspected or has no persisted result."
  UNKNOWN
}

"Derived overall state for a worktree."
enum WorktreePreparationOverallState {
  "The repository has no preparation definitions."
  NOT_CONFIGURED
  "At least one current definition has not been applied."
  PENDING
  "Every applicable definition is applied."
  APPLIED
  "At least one definition has been explicitly undone."
  UNDONE
  "At least one managed path has drifted."
  DRIFTED
  "Preparation state is suspended while Git conflict work is active."
  SUSPENDED
  "No configured definition currently applies to this worktree."
  NOT_APPLICABLE
  "At least one preparation result is an error."
  ERROR
  "The aggregate preparation state is not known."
  UNKNOWN
}

"Typed outcome returned by worktree Sync and Rebase jobs."
enum WorktreeOperationOutcome {
  "The requested Git operation completed successfully."
  COMPLETED
  "Preparation-managed paths block the operation and require an explicit force retry."
  PREPARATION_CONFLICT
  "The rebase has genuine Git conflicts requiring resolution."
  REBASE_CONFLICT
}

"Why Auto Sync is paused."
enum WorktreeAutoSyncPauseReason {
  "Preparation-managed paths require an explicit force sync."
  PREPARATION_CONFLICT
  "A rebase conflict requires the configured conflict workflow."
  REBASE_CONFLICT
  "The worktree branch changed from the branch Auto Sync was configured for."
  BRANCH_CHANGED
  "Auto Sync encountered another error."
  ERROR
}

"Values supported for worktree branch."
enum WorktreeBranchMode {
  "Uses the new mode."
  NEW
  "Uses the existing mode."
  EXISTING
  "Uses the ticket mode."
  TICKET
}


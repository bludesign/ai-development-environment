extend type Query {
  "Returns a codebase project, or null when it cannot be found."
  iosAppProject("Identifier of the codebase." codebaseId: ID!): CodebaseProject
  "Returns build signing options."
  buildSigningOptions(
    "Identifier of the build."
    buildId: ID!
  ): BuildSigningOptions!
  "Returns build scripts."
  buildScripts: [BuildScript!]!
  "Returns a build page."
  builds(
    "Maximum number of records to return. Defaults to `50`."
    first: Int = 50
    "Cursor or identifier after which to return records. Omit it to leave this dimension unfiltered."
    after: ID
    "The status used to filter or perform the operation. Omit it to leave this dimension unfiltered."
    status: BuildStatus
    "Identifier of the codebase. Omit it to leave this dimension unfiltered."
    codebaseId: ID
    "Identifier of the worktree. Omit it to leave this dimension unfiltered."
    worktreeId: ID
  ): BuildPage!
  "Returns a build, or null when it cannot be found."
  build("Identifier of the resource to return or affect." id: ID!): Build
  "Returns build log chunks."
  buildLogChunks(
    "Identifier of the build."
    buildId: ID!
    "Cursor or identifier after which to return records. Omit it to leave this dimension unfiltered."
    after: ID
    "Maximum number of records to return. Defaults to `1000`."
    first: Int = 1000
  ): [BuildLogChunk!]!
  "Returns build reports."
  worktreeCoverageReports(
    "Identifier of the worktree."
    worktreeId: ID!
  ): [BuildReport!]!
}

extend type Mutation {
  "Creates an iOS app project and returns a codebase project."
  createIosAppProject(
    "Identifier of the codebase."
    codebaseId: ID!
  ): CodebaseProject!
  "Saves a build configuration and returns the updated build configuration."
  saveBuildConfiguration(
    "Values for the requested operation."
    input: SaveBuildConfigurationInput!
  ): BuildConfiguration!
  "Deletes a build configuration and reports whether the operation succeeded."
  deleteBuildConfiguration(
    "Identifier of the resource to return or affect."
    id: ID!
  ): Boolean!
  "Discovers build sources and returns discovered build sources."
  discoverBuildSources(
    "Identifier of the worktree."
    worktreeId: ID!
    "Identifier of the request."
    requestId: ID!
  ): [DiscoveredBuildSource!]!
  "Inspects a build source and returns a build source inspection."
  inspectBuildSource(
    "Values for the requested operation."
    input: InspectBuildSourceInput!
  ): BuildSourceInspection!
  "Reparses a build configuration and returns a build source observation."
  reparseBuildConfiguration(
    "Identifier of the configuration."
    configurationId: ID!
    "Identifier of the worktree."
    worktreeId: ID!
    "Identifier of the request."
    requestId: ID!
  ): BuildSourceObservation!
  "Inspects build destinations and returns JSON values."
  inspectBuildDestinations(
    "Values for the requested operation."
    input: InspectBuildDestinationsInput!
  ): [JSON!]!
  "Inspects build run destinations and returns JSON values."
  inspectBuildRunDestinations(
    "Identifier of the build."
    buildId: ID!
    "Identifier of the request."
    requestId: ID!
  ): [JSON!]!
  "Saves a build script and returns the updated build script."
  saveBuildScript(
    "Values for the requested operation."
    input: SaveBuildScriptInput!
  ): BuildScript!
  "Deletes a build script and reports whether the operation succeeded."
  deleteBuildScript(
    "Identifier of the resource to return or affect."
    id: ID!
  ): Boolean!
  "Sets codebase build scripts and returns the updated codebase project."
  setCodebaseBuildScripts(
    "Identifier of the codebase."
    codebaseId: ID!
    "Identifiers of the scripts."
    scriptIds: [ID!]!
  ): CodebaseProject!
  "Starts a build and returns a build."
  startBuild(
    "Values for the requested operation."
    input: StartBuildInput!
  ): Build!
  "Rebuilds a build and returns a build."
  rebuildBuild(
    "Identifier of the resource to return or affect."
    id: ID!
    "Identifier of the request."
    requestId: ID!
  ): Build!
  "Cancels a build and returns a build."
  cancelBuild("Identifier of the resource to return or affect." id: ID!): Build!
  "Deletes builds and returns the number of deleted records."
  deleteBuilds(
    "Identifiers of the resources to return or affect."
    ids: [ID!]!
  ): Int!
  "Runs a build and returns build deployments."
  runBuild(
    "Values for the requested operation."
    input: RunBuildInput!
  ): [BuildDeployment!]!
  "Exports a build archive and returns a build export."
  exportBuildArchive(
    "Values for the requested operation."
    input: ExportBuildArchiveInput!
  ): BuildExport!
  "Parses build test results and returns a build report."
  parseBuildTestResults(
    "Identifier of the build."
    buildId: ID!
    "Identifier of the request."
    requestId: ID!
  ): BuildReport!
  "Generates a build coverage report and returns a build report."
  generateBuildCoverageReport(
    "Identifier of the build."
    buildId: ID!
    "Identifier of the request."
    requestId: ID!
  ): BuildReport!
  "Starts worktree coverage and returns a build."
  startWorktreeCoverage(
    "Values for the requested operation."
    input: StartBuildInput!
  ): Build!
  "Reports build progress and returns a build."
  reportBuildProgress(
    "Values for the requested operation."
    input: BuildProgressInput!
  ): Build!
  "Appends build log chunks and returns build log chunks."
  appendBuildLogChunks(
    "Identifier of the build."
    buildId: ID!
    "Chunks used to filter or perform the operation."
    chunks: [BuildLogChunkInput!]!
  ): [BuildLogChunk!]!
}

extend type Subscription {
  "Emits a build change whenever builds change."
  buildsChanged: BuildChange!
  "Emits a build change whenever build changes."
  buildChanged(
    "Identifier of the resource to return or affect."
    id: ID!
  ): BuildChange!
  "Emits a build log chunk whenever build log chunk is added."
  buildLogChunkAdded("Identifier of the build." buildId: ID!): BuildLogChunk!
}

"A person eligible to review code at the connected provider."
type CodeReviewerPerson {
  "Provider-scoped stable user identifier."
  id: ID!
  "Provider login or username."
  username: String!
  "Display name."
  name: String!
  "Provider avatar URL, when available."
  avatarUrl: String
  "Provider profile URL, when available."
  url: String
}

"A repository-wide preferred reviewer pool."
type CodeReviewerPool {
  "Stable provider-scoped ownership or rule key."
  key: String!
  "Human-readable ownership group or approval rule."
  name: String!
  "GENERAL, CODEOWNERS, or APPROVAL_RULE."
  kind: String!
  "Currently discoverable eligible members."
  candidates: [CodeReviewerPerson!]!
  "Preferred people saved for this group."
  selectedReviewerIds: [ID!]!
  "Saved people whose eligibility can no longer be verified."
  unavailableReviewerIds: [ID!]!
}

"Reviewer preferences and provider discovery for a repository."
type RepositoryCodeReviewers {
  "Canonical repository identifier."
  repositoryId: ID!
  "Connected source control provider."
  provider: String!
  "Branch used to discover code ownership."
  ref: String!
  "Provider default branch."
  defaultRef: String!
  "Available discovery branches."
  refs: [String!]!
  "Discovered and previously configured reviewer pools."
  pools: [CodeReviewerPool!]!
  "Actionable discovery or capability issues."
  issues: [String!]!
  "Whether all applicable provider rules could be discovered."
  discoveryComplete: Boolean!
}

"One actual approval requirement for this pull or merge request."
type ReviewerAssignmentRequirement {
  "Stable requirement identifier."
  id: ID!
  "Provider rule or ownership description."
  name: String!
  "Preferred reviewer pools contributing candidates."
  poolKeys: [String!]!
  "Number of distinct approvals required."
  requiredApprovals: Int!
  "People eligible under the provider rule."
  eligibleReviewerIds: [ID!]!
  "Eligible configured people available for new requests."
  candidateReviewerIds: [ID!]!
  "Valid approving people, distinct from pending requests."
  approvedReviewerIds: [ID!]!
  "Eligible people already requested to review."
  requestedReviewerIds: [ID!]!
}

"Live reviewer options or a random selection preview."
type WorktreeReviewerAssignment {
  "Whether the full eligible membership was loaded, independently of discovery errors."
  membersLoaded: Boolean!
  "Whether a directory refresh failed and retained membership is being displayed."
  directoryStale: Boolean!
  "Worktree being reviewed."
  worktreeId: ID!
  "Provider request identity to bind subsequent assignment."
  requestId: ID!
  "Pull or merge request URL."
  requestUrl: String!
  "Connected source control provider."
  provider: String!
  "Whether the request remains open."
  requestOpen: Boolean!
  "Author, excluded from new reviewer requests."
  authorId: ID!
  "People referenced by the options and existing reviews."
  reviewers: [CodeReviewerPerson!]!
  "Applicable provider requirements and fallback assignment targets."
  requirements: [ReviewerAssignmentRequirement!]!
  "Existing individual reviewer requests."
  currentReviewerIds: [ID!]!
  "People whose approvals are currently valid."
  approvedReviewerIds: [ID!]!
  "Proposed additions; populated by random preview."
  selectedReviewerIds: [ID!]!
  "Discovery issues and unmet assignment targets."
  issues: [String!]!
  "Whether all applicable provider rules could be discovered."
  discoveryComplete: Boolean!
}

"An ownership group or approval pool contributing to a request's review rule."
type WorktreeReviewGroup {
  "Provider-scoped group key."
  key: String!
  "Provider group or pool name."
  name: String!
  "GENERAL, CODEOWNERS, or APPROVAL_RULE."
  kind: String!
}

"An applicable provider approval rule or suggested ownership review."
type WorktreeReviewRequirement {
  "Provider-scoped rule identifier."
  id: ID!
  "Provider rule description."
  name: String!
  "Whether this rule enforces an approval requirement."
  isRequired: Boolean!
  "Applicable ownership or review file patterns."
  patterns: [String!]!
  "Distinct approvals required by policy; zero for suggestions."
  requiredApprovals: Int!
  "Groups contributing eligible reviewers, without splitting the rule's quota."
  groups: [WorktreeReviewGroup!]!
  "People eligible to approve under this rule."
  eligibleReviewerIds: [ID!]!
  "Distinct eligible people whose approvals are valid."
  approvedReviewerIds: [ID!]!
  "Eligible people currently requested to review."
  requestedReviewerIds: [ID!]!
}

"Read-only review details independent of saved reviewer preferences."
type WorktreeReviewStatus {
  "Whether the full eligible membership was loaded, independently of discovery errors."
  membersLoaded: Boolean!
  "Whether a directory refresh failed and retained membership is being displayed."
  directoryStale: Boolean!
  "Worktree being inspected."
  worktreeId: ID!
  "Linked provider request identifier."
  requestId: ID!
  "Pull or merge request URL."
  requestUrl: String!
  "Connected source control provider."
  provider: String!
  "Whether the request remains open."
  requestOpen: Boolean!
  "People referenced by current reviews and applicable rules."
  reviewers: [CodeReviewerPerson!]!
  "Existing individual review requests."
  currentReviewerIds: [ID!]!
  "People whose approvals are currently valid."
  approvedReviewerIds: [ID!]!
  "Applicable rules, preserving provider grouping."
  requirements: [WorktreeReviewRequirement!]!
  "Provider discovery or capability issues."
  issues: [String!]!
  "Whether the requested discovery scope completed without provider errors."
  discoveryComplete: Boolean!
}

"Preferred people for one discovered group; an empty list clears its pool."
input CodeReviewerPoolInput {
  "Discovered stable pool key."
  key: String!
  "Provider-scoped user identifiers."
  reviewerIds: [ID!]!
}

"Save displayed pools, retaining preferences for other branches."
input SaveRepositoryCodeReviewersInput {
  "Canonical repository identifier."
  repositoryId: ID!
  "Branch used to validate discovery."
  ref: String
  "Pools to update or clear."
  pools: [CodeReviewerPoolInput!]!
}

"Add reviewer requests and optionally remove existing individual requests."
input AssignWorktreeReviewersInput {
  "Existing individual reviewer requests to remove. Approvals are unaffected."
  removeReviewerIds: [ID!]
  "Allow additions from the full eligible directory without changing saved pools."
  includeAllReviewers: Boolean = false
  "Worktree being reviewed."
  worktreeId: ID!
  "Expected provider request identity from reviewer options."
  requestId: ID!
  "Eligible people to request, using preferred pools unless explicitly expanded."
  reviewerIds: [ID!]!
}

extend type Query {
  "Inspect a linked pull or merge request's live reviews without configuring reviewers."
  worktreeReviewStatus(
    "Load the full eligible directory; false loads only needed people."
    includeEligibleReviewers: Boolean = true
    "Refresh cached directory data on demand."
    refresh: Boolean = false
    "Worktree with a linked pull or merge request."
    worktreeId: ID!
  ): WorktreeReviewStatus!
  "Discover eligible reviewer groups and load saved preferences."
  repositoryCodeReviewers(
    "Canonical repository identifier."
    repositoryId: ID!
    "Branch to inspect; defaults to the provider default branch."
    ref: String
    "Bypass cached discovery when true."
    refresh: Boolean
  ): RepositoryCodeReviewers!
  "Load live reviewer assignment options for an open request."
  worktreeReviewerAssignment(
    "Allow manual selection outside preferred pools. Random selection still uses preferences."
    includeAllReviewers: Boolean = false
    "Load the full eligible directory; false loads only needed people."
    includeEligibleReviewers: Boolean = true
    "Refresh cached directory data on demand."
    refresh: Boolean = false
    "Worktree with an open pull or merge request."
    worktreeId: ID!
  ): WorktreeReviewerAssignment!
  "Choose additional reviewers without sending requests or persisting changes."
  previewRandomWorktreeReviewers(
    "Worktree being reviewed."
    worktreeId: ID!
    "Expected request identity from current options."
    requestId: ID!
    "Manual selections to keep while filling outstanding slots."
    selectedReviewerIds: [ID!]
    "Pending reviewer request removals to exclude from coverage and selection. Approvals are unaffected."
    removeReviewerIds: [ID!]
  ): WorktreeReviewerAssignment!
}

extend type Mutation {
  "Save preferred reviewers for repository ownership and approval groups."
  saveRepositoryCodeReviewers(
    "Displayed reviewer pools to update or clear."
    input: SaveRepositoryCodeReviewersInput!
  ): RepositoryCodeReviewers!
  "Apply additions and explicit removals while preserving unrelated requests and approvals."
  assignWorktreeReviewers(
    "Expected request, eligible additions, and optional removals."
    input: AssignWorktreeReviewersInput!
  ): WorktreeReviewerAssignment!
}

extend type CodebaseRepository {
  "Whether at least one preferred reviewer has been configured."
  hasConfiguredCodeReviewers: Boolean!
}

extend type Worktree {
  "Whether this worktree has an open PR/MR and configured reviewer pools."
  canAssignReviewers: Boolean!
}

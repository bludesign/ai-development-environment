enum ExternalMcpTransport {
  STREAMABLE_HTTP
  SSE
}

type ExternalMcpServerHeader {
  id: ID!
  name: String!
  valueConfigured: Boolean!
}

type ExternalMcpServer {
  id: ID!
  name: String!
  url: String!
  transport: ExternalMcpTransport!
  toolNamePrefix: String!
  headers: [ExternalMcpServerHeader!]!
  createdAt: String!
  updatedAt: String!
}

type ExternalMcpServerRemoval {
  id: ID!
}

type McpToolPreset {
  id: ID!
  name: String!
  description: String!
  iconKey: String!
  enabledForPlans: Boolean!
  enabledForSessions: Boolean!
  toolNames: [String!]!
  createdAt: String!
  updatedAt: String!
}

type McpToolPresetRemoval {
  id: ID!
}

type ToolCallAudit {
  id: ID!
  correlationId: String!
  caller: String!
  source: String!
  groupId: String!
  toolName: String!
  argumentsSha256: String!
  resultStatus: String!
  durationMs: Int
  startedAt: String!
  finishedAt: String
}

type ToolCallAuditClearResult {
  count: Int!
}

input ExternalMcpServerHeaderInput {
  id: ID
  name: String!
  value: String
}

input ExternalMcpServerInput {
  name: String!
  url: String!
  transport: ExternalMcpTransport!
  toolNamePrefix: String
  headers: [ExternalMcpServerHeaderInput!]!
}

input McpToolPresetInput {
  name: String!
  description: String
  iconKey: String!
  enabledForPlans: Boolean!
  enabledForSessions: Boolean!
  toolNames: [String!]!
}

extend type Query {
  externalMcpServers: [ExternalMcpServer!]!
  mcpToolPresets(kind: RunKind): [McpToolPreset!]!
  toolCallAudits(
    first: Int
    toolName: String
    resultStatus: String
  ): [ToolCallAudit!]!
}

extend type Mutation {
  clearToolCallAudits: ToolCallAuditClearResult!
  createExternalMcpServer(input: ExternalMcpServerInput!): ExternalMcpServer!
  updateExternalMcpServer(
    id: ID!
    input: ExternalMcpServerInput!
  ): ExternalMcpServer!
  deleteExternalMcpServer(id: ID!): ExternalMcpServerRemoval!
  createMcpToolPreset(input: McpToolPresetInput!): McpToolPreset!
  updateMcpToolPreset(id: ID!, input: McpToolPresetInput!): McpToolPreset!
  deleteMcpToolPreset(id: ID!): McpToolPresetRemoval!
}

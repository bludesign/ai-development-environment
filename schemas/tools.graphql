"Values supported for external MCP transport."
enum ExternalMcpTransport {
  "Represents the streamable HTTP option."
  STREAMABLE_HTTP
  "Represents the sse option."
  SSE
}

"Represents an external MCP server header in the GraphQL API."
type ExternalMcpServerHeader {
  "Stable identifier for this external MCP server header."
  id: ID!
  "Display name of this external MCP server header."
  name: String!
  "Whether the value configured condition is true for this external MCP server header."
  valueConfigured: Boolean!
}

"Represents an external MCP server in the GraphQL API."
type ExternalMcpServer {
  "Stable identifier for this external MCP server."
  id: ID!
  "Display name of this external MCP server."
  name: String!
  "URL for this external MCP server."
  url: String!
  "The transport associated with this external MCP server."
  transport: ExternalMcpTransport!
  "The tool name prefix associated with this external MCP server."
  toolNamePrefix: String!
  "Headers associated with this external MCP server."
  headers: [ExternalMcpServerHeader!]!
  "ISO 8601 timestamp when this external MCP server was created."
  createdAt: String!
  "ISO 8601 timestamp when this external MCP server was last updated."
  updatedAt: String!
}

"Represents an external MCP server removal in the GraphQL API."
type ExternalMcpServerRemoval {
  "Stable identifier for this external MCP server removal."
  id: ID!
}

"Represents an MCP tool preset in the GraphQL API."
type McpToolPreset {
  "Stable identifier for this MCP tool preset."
  id: ID!
  "Display name of this MCP tool preset."
  name: String!
  "Human-readable description of this MCP tool preset."
  description: String!
  "The icon key associated with this MCP tool preset."
  iconKey: String!
  "Whether the enabled for plans condition is true for this MCP tool preset."
  enabledForPlans: Boolean!
  "Whether the enabled for sessions condition is true for this MCP tool preset."
  enabledForSessions: Boolean!
  "Tool names associated with this MCP tool preset."
  toolNames: [String!]!
  "Source-qualified membership, including external tools."
  tools: [McpToolReference!]!
  "ISO 8601 timestamp when this MCP tool preset was created."
  createdAt: String!
  "ISO 8601 timestamp when this MCP tool preset was last updated."
  updatedAt: String!
}

"Represents an MCP tool preset removal in the GraphQL API."
type McpToolPresetRemoval {
  "Stable identifier for this MCP tool preset removal."
  id: ID!
}

"Represents a tool call audit in the GraphQL API."
type ToolCallAudit {
  "Stable identifier for this tool call audit."
  id: ID!
  "Identifier of the related correlation."
  correlationId: String!
  "The caller associated with this tool call audit."
  caller: String!
  "The source associated with this tool call audit."
  source: String!
  "Identifier of the related group."
  groupId: String!
  "The tool name associated with this tool call audit."
  toolName: String!
  "The arguments sha256 associated with this tool call audit."
  argumentsSha256: String!
  "The result status associated with this tool call audit."
  resultStatus: String!
  "The duration ms associated with this tool call audit. May be null when unavailable or not applicable."
  durationMs: Int
  "ISO 8601 timestamp when this tool call audit started."
  startedAt: String!
  "ISO 8601 timestamp when this tool call audit finished. May be null when unavailable or not applicable."
  finishedAt: String
}

"The result of tool call audit clear."
type ToolCallAuditClearResult {
  "Number of counts."
  count: Int!
}

"Input values for external MCP server header."
input ExternalMcpServerHeaderInput {
  "Identifier of the external MCP server header to affect."
  id: ID
  "The name to use for the request."
  name: String!
  "The value to use for the request."
  value: String
}

"Input values for external MCP server."
input ExternalMcpServerInput {
  "The name to use for the request."
  name: String!
  "The URL to use for the request."
  url: String!
  "The transport to use for the request."
  transport: ExternalMcpTransport!
  "The tool name prefix to use for the request."
  toolNamePrefix: String
  "Headers to use for the request."
  headers: [ExternalMcpServerHeaderInput!]!
}

"Input values for MCP tool preset."
input McpToolPresetInput {
  "The name to use for the request."
  name: String!
  "The description to use for the request."
  description: String
  "The icon key to use for the request."
  iconKey: String!
  "Whether enabled for plans applies to the request."
  enabledForPlans: Boolean!
  "Whether enabled for sessions applies to the request."
  enabledForSessions: Boolean!
  "Tool names to use for the request."
  toolNames: [String!]
  "Complete source-qualified membership. Do not also provide toolNames."
  tools: [McpToolReferenceInput!]
}

"The provider of an MCP tool."
enum McpToolSource {
  "builtin option."
  BUILTIN
  "external option."
  EXTERNAL
}

"A stable tool reference. External names are upstream names without prefixes."
type McpToolReference {
  "Whether this reference identifies a built-in or external tool."
  source: McpToolSource!
  "The exact tool name, or the human-readable name of this preset or server."
  name: String!
  "The identifier of an already configured local external server; absent for built-in tools."
  serverId: ID
  "The display name of the configured external server."
  serverName: String
}

"A tool selected for a preset."
input McpToolReferenceInput {
  "Whether this reference identifies a built-in or external tool."
  source: McpToolSource!
  "The exact tool name, or the human-readable name of this preset or server."
  name: String!
  "The identifier of an already configured local external server; absent for built-in tools."
  serverId: ID
}

"Supported catalog download formats."
enum McpToolExportFormat {
  "json option."
  JSON
  "markdown option."
  MARKDOWN
}

"Catalog sources included in a download."
enum McpToolCatalogSource {
  "all option."
  ALL
  "builtin option."
  BUILTIN
  "external option."
  EXTERNAL
}

"An exported document ready to save or share."
type McpToolDocumentExport {
  "Suggested filename for saving the exported document."
  filename: String!
  "MIME type of the exported document."
  contentType: String!
  "The complete UTF-8 document text."
  content: String!
}

"How an imported preset should be handled."
enum McpToolPresetImportAction {
  "create option."
  CREATE
  "replace option."
  REPLACE
  "skip option."
  SKIP
}

"A reviewed action for one preset in a document."
input McpToolPresetImportDecisionInput {
  "Zero-based index of a preset in the portable document."
  index: Int!
  "Create a new preset, replace a selected preset, or skip this entry."
  action: McpToolPresetImportAction!
  "The exact tool name, or the human-readable name of this preset or server."
  name: String
  "Local identifier of the preset explicitly chosen for replacement."
  targetId: ID
}

"Mapping to an already configured external MCP server."
input McpToolPresetServerMappingInput {
  "serverkey option."
  serverKey: String!
  "The identifier of an already configured local external server; absent for built-in tools."
  serverId: ID!
}

"A portable preset document and the user's import choices."
input McpToolPresetImportInput {
  "The complete portable preset JSON document, limited to 2 MiB."
  document: String!
  "Reviewed actions for individual presets; omitted entries default to CREATE."
  decisions: [McpToolPresetImportDecisionInput!]
  "Mappings from portable server keys to existing configured local servers."
  serverMappings: [McpToolPresetServerMappingInput!]
}

"Validation results for one imported preset."
type McpToolPresetImportEntry {
  "Zero-based index of a preset in the portable document."
  index: Int!
  "The exact tool name, or the human-readable name of this preset or server."
  name: String!
  "Create a new preset, replace a selected preset, or skip this entry."
  action: McpToolPresetImportAction!
  "Local identifier of the preset explicitly chosen for replacement."
  targetId: ID
  "Number of selected tools in this imported preset."
  toolCount: Int!
  "Validation errors that must be resolved before importing."
  errors: [String!]!
  "Non-blocking information about availability or configuration."
  warnings: [String!]!
}

"A portable external server and its available local mappings."
type McpToolPresetImportServer {
  "Portable document-local external server key."
  key: String!
  "The exact tool name, or the human-readable name of this preset or server."
  name: String!
  "Optional transport hint from the portable document."
  transport: ExternalMcpTransport
  "Local server explicitly selected in the import choices."
  selectedServerId: ID
  "An unambiguous matching server suggested for review; never applied automatically."
  suggestedServerId: ID
  "Already configured servers available for explicit mapping."
  candidates: [ExternalMcpServer!]!
}

"Server validation of a proposed import. Re-preview after changing choices."
type McpToolPresetImportPreview {
  "Fingerprint of this document, choices, and current validated state."
  token: String!
  "True when all selected entries can be imported without errors."
  canImport: Boolean!
  "Validation errors that must be resolved before importing."
  errors: [String!]!
  "Per-preset validation results in document order."
  entries: [McpToolPresetImportEntry!]!
  "External server references that may require a local mapping."
  externalServers: [McpToolPresetImportServer!]!
}

extend type Query {
  "Export current tool definitions with an AI preset-generation contract."
  exportMcpToolCatalog(
    "The desired document format."
    format: McpToolExportFormat!
    "Whether this reference identifies a built-in or external tool."
    source: McpToolCatalogSource = ALL
    "Optional catalog group identifiers to include, including their descendants."
    groupIds: [ID!]
  ): McpToolDocumentExport!
  "Export one or more portable presets without local IDs or credentials."
  exportMcpToolPresets(
    "Local preset identifiers to include in the export."
    ids: [ID!]!
  ): McpToolDocumentExport!
  "Validate an import without saving changes."
  previewMcpToolPresetImport(
    "The portable document and reviewed import choices."
    input: McpToolPresetImportInput!
  ): McpToolPresetImportPreview!
  "Returns external MCP servers."
  externalMcpServers: [ExternalMcpServer!]!
  "Returns MCP tool presets."
  mcpToolPresets(
    "The kind used to filter or perform the operation. Omit it to leave this dimension unfiltered."
    kind: RunKind
  ): [McpToolPreset!]!
  "Returns tool call audits."
  toolCallAudits(
    "Maximum number of records to return. Omit it to leave this dimension unfiltered."
    first: Int
    "The tool name used to filter or perform the operation. Omit it to leave this dimension unfiltered."
    toolName: String
    "The result status used to filter or perform the operation. Omit it to leave this dimension unfiltered."
    resultStatus: String
  ): [ToolCallAudit!]!
}

extend type Mutation {
  "Apply an unchanged, valid preview in one transaction."
  importMcpToolPresets(
    "The portable document and reviewed import choices."
    input: McpToolPresetImportInput!
    "Token returned by the latest unchanged and valid import preview."
    previewToken: String!
  ): [McpToolPreset!]!
  "Clears tool call audits and returns a tool call audit clear result."
  clearToolCallAudits: ToolCallAuditClearResult!
  "Creates an external MCP server and returns an external MCP server."
  createExternalMcpServer(
    "Values for the requested operation."
    input: ExternalMcpServerInput!
  ): ExternalMcpServer!
  "Updates an external MCP server and returns the updated external MCP server."
  updateExternalMcpServer(
    "Identifier of the resource to return or affect."
    id: ID!
    "Values for the requested operation."
    input: ExternalMcpServerInput!
  ): ExternalMcpServer!
  "Deletes an external MCP server and returns an external MCP server removal."
  deleteExternalMcpServer(
    "Identifier of the resource to return or affect."
    id: ID!
  ): ExternalMcpServerRemoval!
  "Creates an MCP tool preset and returns an MCP tool preset."
  createMcpToolPreset(
    "Values for the requested operation."
    input: McpToolPresetInput!
  ): McpToolPreset!
  "Updates an MCP tool preset and returns the updated MCP tool preset."
  updateMcpToolPreset(
    "Identifier of the resource to return or affect."
    id: ID!
    "Values for the requested operation."
    input: McpToolPresetInput!
  ): McpToolPreset!
  "Deletes an MCP tool preset and returns an MCP tool preset removal."
  deleteMcpToolPreset(
    "Identifier of the resource to return or affect."
    id: ID!
  ): McpToolPresetRemoval!
}

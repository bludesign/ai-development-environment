  "Linked Jira issue key."
  ticketKey: String
  "Actionable error from reconciliation or an unfinished follow-up."
  lastError: String
  "Time GitLab was confirmed to have merged the request."
  mergeConfirmedAt: String
  "Time the Jira follow-up completed."
  ticketMovedAt: String
  "Time the worktree cleanup completed."
  worktreeDeletedAt: String
  "Time this operation last changed."
  updatedAt: String!
}

"Current GitLab project policy, readiness, defaults and linked follow-ups."
